[package]
name = "solid-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Shared authenticated file framing, credentials, and safe file publication"

[dependencies]
aead = "=0.5.2"
argon2 = { version = "=0.5.3", features = ["std", "zeroize"] }
clap = { version = "4.5", features = ["derive"] }
getrandom = "=0.4.3"
hkdf = "=0.12.4"
rpassword = "7.4"
sha2 = "=0.10.9"
tempfile.workspace = true
zeroize = "=1.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
aes-gcm-siv = "=0.11.1"
chacha20poly1305 = "=0.10.1"
hex-literal = "=1.1.0"

[lints]
workspace = true
