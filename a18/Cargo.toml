[package]
name = "a18"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "AES-256-GCM-SIV file encryption with embedded-key credentials"

[dependencies]
solid-core = { path = "../support/solid-core" }
aes-gcm-siv = { version = "=0.11.1" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Integration tests exercise the library and the actual executable.
[lib]
test = false

[[bin]]
name = "a18"
path = "src/main.rs"
test = false
